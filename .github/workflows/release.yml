name: Release Dilmeter

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cn-rt/front/package-lock.json
            ot/front/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24.11
          cache-dependency-path: |
            cn-rt/go.sum
            ot/go.sum

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if (-not $version) { $version = "${{ github.ref_name }}" -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        shell: pwsh
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Update Windows version metadata
        shell: pwsh
        run: ./scripts/set-winres-version.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm ci --prefix cn-rt/front
          npm ci --prefix ot/front

      - name: Build CN and RT
        shell: pwsh
        env:
          DILMETER_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          cmd /c cn-rt\build.bat
          cmd /c cn-rt\build_backend.bat
          cmd /c cn-rt\build_rt.bat

      - name: Verify frontend behavior and OT terminology
        shell: pwsh
        run: |
          foreach ($frontend in @('cn-rt/front', 'ot/front')) {
            Push-Location $frontend
            try {
              npx vue-tsc --noEmit
              if ($LASTEXITCODE -ne 0) { throw "Type check failed: $frontend" }
              foreach ($check in @('verify:arcana-kpi', 'verify:lancer-kpi', 'verify:aim-kpi-sampling', 'verify:burst-reminders', 'verify:healer-templates', 'verify:battle-record', 'verify:v152', 'verify:external-links', 'verify:native-ready', 'verify:effect-timer', 'verify:spirit-awakening', 'verify:monitor-extensions', 'verify:frenzy-kpi')) {
                npm run $check
                if ($LASTEXITCODE -ne 0) { throw "Check failed: $frontend $check" }
              }
              if ($frontend -eq 'ot/front') {
                npm run verify:tw-resources
                if ($LASTEXITCODE -ne 0) { throw 'TW resource regression failed' }
                npm run verify:tw-game-terms
                if ($LASTEXITCODE -ne 0) { throw 'TW terminology regression failed' }
              }
            } finally { Pop-Location }
          }

      - name: Build OT
        shell: pwsh
        env:
          DILMETER_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          cmd /c ot\build.bat
          cmd /c ot\build_backend.bat

      - name: Package release
        shell: pwsh
        env:
          DILMETER_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          cmd /c cn-rt\package_release.bat
          cmd /c ot\package_release.bat

      - name: Package optional Xiaoxiao speech addon
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "artifacts\release-v${{ steps.version.outputs.value }}"
          python scripts/package-edge-tts-addon.py --output $releaseDir
          if ($LASTEXITCODE -ne 0) { throw 'Speech addon packaging failed' }
          $addon = Get-ChildItem -LiteralPath $releaseDir -Filter 'Dilmeter-EdgeTTS-Addon-*-win-x64.zip'
          if (@($addon).Count -ne 1) { throw 'Expected one speech addon ZIP' }
          $testRoot = Join-Path $releaseDir 'speech-addon-test'
          Expand-Archive -LiteralPath $addon.FullName -DestinationPath $testRoot
          $env:DILMETER_EDGE_TTS_ADDON_TEST_ROOT = $testRoot
          foreach ($variant in @('cn-rt', 'ot')) {
            Push-Location $variant
            try {
              go test ./cmd/dilmeterapi -run EdgeTTS -count=1
              if ($LASTEXITCODE -ne 0) { throw "Speech addon test failed: $variant" }
              if ($variant -eq 'cn-rt') {
                go test -tags dilmeter_rt ./cmd/dilmeterapi -run EdgeTTS -count=1
                if ($LASTEXITCODE -ne 0) { throw 'Speech addon test failed: RT' }
              }
            } finally { Pop-Location }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          $releaseDir = Join-Path $PWD "artifacts\release-v$version"
          $assets = Get-ChildItem -LiteralPath $releaseDir -File | Where-Object { $_.Name -match '^Dilmeter(?:CN|RT|OT)\.(?:zip|json)$' }
          if ($assets.Count -ne 6) { throw "Expected 6 release assets, found $($assets.Count)" }
          $speechAssets = Get-ChildItem -LiteralPath $releaseDir -File | Where-Object { $_.Name -match '^Dilmeter-EdgeTTS-Addon(?:-v[0-9.]+-win-x64\.zip|\.json)$' }
          if ($speechAssets.Count -ne 2) { throw 'Expected speech addon ZIP and checksum manifest' }
          $assets = @($assets) + @($speechAssets)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($assets.FullName) --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh release edit $tag --title "Dilmeter $tag" --notes-file "cn-rt/release-notes-current.txt"
          } else {
            gh release create $tag @($assets.FullName) --target "${{ github.sha }}" --title "Dilmeter $tag" --notes-file "cn-rt/release-notes-current.txt"
          }


      - name: Mirror verified release to Gitee
        shell: pwsh
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          if (-not $env:GITEE_ACCESS_TOKEN) { throw 'GITEE_ACCESS_TOKEN is required for dual publication' }
          python scripts/sync-gitee-release.py --release-dir "artifacts/release-v${{ steps.version.outputs.value }}" --version "${{ steps.version.outputs.value }}" --notes-file cn-rt/release-notes-current.txt
          if ($LASTEXITCODE -ne 0) { throw 'Gitee mirror or public download verification failed' }
