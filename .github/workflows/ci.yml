name: Verify Dilmeter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [cn-rt, ot]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/front/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.11
          cache-dependency-path: ${{ matrix.project }}/go.sum

      - name: Install frontend dependencies
        working-directory: ${{ matrix.project }}/front
        run: npm ci

      - name: Build embedded frontend
        working-directory: ${{ matrix.project }}
        run: cmd /c build.bat

      - name: Run Go tests
        working-directory: ${{ matrix.project }}
        run: go test -count=1 ./...

      - name: Run RT Go tests
        if: matrix.project == 'cn-rt'
        working-directory: cn-rt
        run: go test -tags dilmeter_rt -count=1 ./...
